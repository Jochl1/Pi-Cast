# mpv settings for Pi-Cast on a Raspberry Pi 3 (loaded via --include).
# hwdec and the audio device come from config.json, see src/config.js.

# --- Output: straight to the TV over DRM/KMS, no desktop needed ---
vo=gpu
gpu-context=drm
gpu-api=opengl
opengl-es=yes
fullscreen=yes
# Zero-copy: decoded frames go straight to a display plane instead of being
# copied back and uploaded to the GPU (~7 fps -> 24 fps at 1080p on a Pi 3).
# The video takes the primary plane and mpv draws the overlays on the plane
# above it; the default (the other way round) is rejected by the vc4 driver.
gpu-hwdec-interop=drmprime-overlay
drm-draw-plane=overlay
drm-drmprime-video-plane=primary
ao=alsa
keep-open=no

# --- Decoding: H.264 only in hardware; the Pi 3 can't do VP9/AV1 ---
hwdec-codecs=h264
vd-lavc-threads=4
framedrop=vo

# --- Links via yt-dlp. YouTube is usually resolved by Pi-Cast's own yt-dlp
# worker (src/ytdl.js); this is the fallback and handles other sites. The
# format comes from config.json (ytdlFormat). ---
ytdl=yes
ytdl-raw-options-append=js-runtimes=node

# --- Cache: the Pi has 1 GB RAM ---
cache=yes
demuxer-max-bytes=50MiB
demuxer-max-back-bytes=20MiB

# --- Cheap scaling; the GPU is weak ---
scale=bilinear
dscale=bilinear
cscale=bilinear
dither=no
deband=no
correct-downscaling=no
linear-downscaling=no
sigmoid-upscaling=no
hdr-compute-peak=no

# --- No built-in UI: Pi-Cast draws its own overlays ---
osc=no
osd-bar=no
osd-on-seek=no
osd-level=1
osd-font=Sora
osd-color="#F5F3FF"
osd-border-color="#0C0B14"
cursor-autohide=always
input-default-bindings=no
input-vo-keyboard=no
