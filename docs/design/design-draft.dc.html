<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pi-Cast design draft</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=Sora:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#9fdcf0}a:hover{color:#ffffff}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
@keyframes pcDriftA{0%{transform:translate(-50px,-20px) scale(1)}50%{transform:translate(60px,30px) scale(1.08)}100%{transform:translate(10px,60px) scale(0.94)}}
@keyframes pcDriftB{0%{transform:translate(40px,30px) scale(1)}50%{transform:translate(-60px,-20px) scale(1.1)}100%{transform:translate(-10px,-50px) scale(0.96)}}
.pc-blob-a{animation:pcDriftA 14s ease-in-out infinite alternate}
.pc-blob-b{animation:pcDriftB 18s ease-in-out infinite alternate}
@media (prefers-reduced-motion: reduce){.pc-blob-a,.pc-blob-b{animation:none}}
</style>
</helmet>
<div style="width: 1440px; height: 3320px; box-sizing: border-box; padding: 48px 40px; display: flex; flex-direction: column; gap: 40px; background: {{t.page}}; color: {{t.text}}; font-family: {{font}};">

  <header style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <p style="margin: 0; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: {{t.muted}};">Design draft · v2</p>
      <h1 style="margin: 0; font-size: 44px; font-weight: 600; letter-spacing: -0.02em;">Pi-Cast look &amp; feel</h1>
      <p style="margin: 0; font-size: 16px; color: {{t.muted}};">Pick a style, accent, logo and font. Every screen below updates live.</p>
    </div>
    <p style="margin: 0; font-size: 14px; color: {{t.muted}};">Current: {{summary}}</p>
  </header>

  <section aria-label="Options" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; padding: 24px; border: 1px solid {{t.line}}; border-radius: {{t.radius}}px; background: {{t.panel}};">
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{t.muted}};">A · Style</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{styleOpts}}" as="o" hint-placeholder-count="3">
          <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.selected}}" style="min-height: 44px; padding: 0 16px; border: 1px solid; border-radius: 999px; font-size: 15px; font-weight: 500; {{o.style}}">{{o.label}}</button>
        </sc-for>
      </div>
      <p style="margin: 0; font-size: 13px; line-height: 1.45; color: {{t.muted}};">{{styleNote}}</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{t.muted}};">B · Accent</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
        <sc-for list="{{accentOpts}}" as="o" hint-placeholder-count="4">
          <button type="button" onClick="{{o.pick}}" aria-label="{{o.label}}" aria-pressed="{{o.selected}}" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: {{o.hex}}; {{o.ring}}"></button>
        </sc-for>
      </div>
      <p style="margin: 0; font-size: 13px; color: {{t.muted}};">{{accentName}} · {{accent}}</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{t.muted}};">C · Logo</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{markOpts}}" as="o" hint-placeholder-count="3">
          <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.selected}}" style="min-height: 44px; padding: 0 16px; border: 1px solid; border-radius: 999px; font-size: 15px; font-weight: 500; {{o.style}}">{{o.label}}</button>
        </sc-for>
      </div>
      <p style="margin: 0; font-size: 13px; line-height: 1.45; color: {{t.muted}};">{{markNote}}</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{t.muted}};">D · Font</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{fontOpts}}" as="o" hint-placeholder-count="3">
          <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.selected}}" style="min-height: 44px; padding: 0 16px; border: 1px solid; border-radius: 999px; font-size: 15px; font-weight: 500; {{o.style}} font-family: {{o.family}};">{{o.label}}</button>
        </sc-for>
      </div>
      <p style="margin: 0; font-size: 13px; line-height: 1.45; color: {{t.muted}};">{{fontNote}}</p>
    </div>
  </section>

  <section aria-label="TV screens" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 48px;">

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
      <figcaption style="font-size: 14px; color: {{t.muted}};"><strong style="color: {{t.text}}; font-weight: 600;">1 · Boot</strong> — glow drifts slowly while the Pi starts (Aurora)</figcaption>
      <div style="width: 656px; height: 376px; box-sizing: border-box; padding: 8px; background: #000000; border-radius: 12px;">
        <div style="width: 640px; height: 360px; position: relative; overflow: hidden; background: {{t.tvBase}}; color: {{t.text}};">
          <sc-if value="{{isAurora}}" hint-placeholder-val="{{true}}">
            <div class="{{blobA}}" style="position: absolute; left: -90px; top: -150px; width: 480px; height: 480px; border-radius: 999px; {{blobAStyle}}"></div>
            <div class="{{blobB}}" style="position: absolute; right: -110px; bottom: -190px; width: 440px; height: 440px; border-radius: 999px; {{blobBStyle}}"></div>
          </sc-if>
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;">
          <sc-if value="{{showBeam}}" hint-placeholder-val="{{true}}"><svg width="76" height="76" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M7 8.6v14.8a1.2 1.2 0 0 0 1.8 1l11.8-7.4a1.2 1.2 0 0 0 0-2L8.8 7.6A1.2 1.2 0 0 0 7 8.6z" fill="{{accent}}"></path><path d="M23.5 11a7.5 7.5 0 0 1 0 10" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round"></path><path d="M27 7.5a12.5 12.5 0 0 1 0 17" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" opacity="0.55"></path></svg></sc-if>
          <sc-if value="{{showTile}}" hint-placeholder-val="{{false}}"><svg width="76" height="76" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="{{tileRx}}" fill="{{accent}}"></rect><path d="M13 10.8v10.4a.8.8 0 0 0 1.2.7l8.3-5.2a.8.8 0 0 0 0-1.4l-8.3-5.2a.8.8 0 0 0-1.2.7z" fill="#0A0C10"></path></svg></sc-if>
          <div style="font-size: {{bootWordSize}}px; font-weight: 600; letter-spacing: -0.02em;">
            <sc-if value="{{isWordmark}}" hint-placeholder-val="{{false}}"><span>pi<span style="color: {{accent}};">·</span>cast</span></sc-if>
            <sc-if value="{{hasMark}}" hint-placeholder-val="{{true}}"><span>Pi-Cast</span></sc-if>
          </div>
          <div style="display: flex; gap: 8px;" aria-hidden="true">
            <span style="width: 6px; height: 6px; border-radius: 999px; background: {{t.dim}};"></span>
            <span style="width: 6px; height: 6px; border-radius: 999px; background: {{accent}};"></span>
            <span style="width: 6px; height: 6px; border-radius: 999px; background: {{t.dim}};"></span>
          </div>
          </div>
          <p style="position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; margin: 0; font-size: 11px; letter-spacing: 0.08em; color: {{t.muted}}; text-transform: uppercase;">Starting up</p>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
      <figcaption style="font-size: 14px; color: {{t.muted}};"><strong style="color: {{t.text}}; font-weight: 600;">2 · Home</strong> — idle, waiting for a cast</figcaption>
      <div style="width: 656px; height: 376px; box-sizing: border-box; padding: 8px; background: #000000; border-radius: 12px;">
        <div style="width: 640px; height: 360px; box-sizing: border-box; padding: 28px 32px; overflow: hidden; background: {{t.tv}}; color: {{t.text}}; display: flex; flex-direction: column;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 52px; font-weight: 600; letter-spacing: -0.03em; line-height: 1;">21:34</span>
              <span style="font-size: 13px; color: {{t.muted}};">Saturday, 24 October</span>
            </div>
            <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: {{t.muted}};">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0"></path><path d="M5 12.5a10 10 0 0 1 14 0"></path><path d="M8.5 16.1a5 5 0 0 1 7 0"></path><circle cx="12" cy="19.5" r="0.8" fill="currentColor"></circle></svg>
              <span>Wi-Fi · Home</span>
            </div>
          </div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
            <sc-if value="{{showBeam}}" hint-placeholder-val="{{true}}"><svg width="40" height="40" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M7 8.6v14.8a1.2 1.2 0 0 0 1.8 1l11.8-7.4a1.2 1.2 0 0 0 0-2L8.8 7.6A1.2 1.2 0 0 0 7 8.6z" fill="{{accent}}"></path><path d="M23.5 11a7.5 7.5 0 0 1 0 10" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round"></path><path d="M27 7.5a12.5 12.5 0 0 1 0 17" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" opacity="0.55"></path></svg></sc-if>
            <sc-if value="{{showTile}}" hint-placeholder-val="{{false}}"><svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="{{tileRx}}" fill="{{accent}}"></rect><path d="M13 10.8v10.4a.8.8 0 0 0 1.2.7l8.3-5.2a.8.8 0 0 0 0-1.4l-8.3-5.2a.8.8 0 0 0-1.2.7z" fill="#0A0C10"></path></svg></sc-if>
            <span style="font-size: 26px; font-weight: 600; letter-spacing: -0.01em;">Ready to cast</span>
            <span style="font-size: 13px; color: {{t.muted}};">Open YouTube on your phone and tap Cast → Pi-Cast</span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: flex-end; padding-top: 14px; border-top: 1px solid {{t.line}};">
            <div style="display: flex; gap: 32px;">
              <div style="display: flex; flex-direction: column; gap: 4px;">
                <span style="font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: {{t.muted}};">TV code</span>
                <span style="font-size: 15px; font-family: 'JetBrains Mono', monospace;">[TV CODE]</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 4px;">
                <span style="font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: {{t.muted}};">Remote</span>
                <span style="font-size: 15px; font-family: 'JetBrains Mono', monospace;">picast.local:8080</span>
              </div>
            </div>
            <span style="font-size: 13px; font-weight: 600; color: {{t.muted}};">
              <sc-if value="{{isWordmark}}" hint-placeholder-val="{{false}}"><span>pi<span style="color: {{accent}};">·</span>cast</span></sc-if>
              <sc-if value="{{hasMark}}" hint-placeholder-val="{{true}}"><span>Pi-Cast</span></sc-if>
            </span>
          </div>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
      <figcaption style="font-size: 14px; color: {{t.muted}};"><strong style="color: {{t.text}}; font-weight: 600;">3 · Now playing</strong> — pop-ups fade out after ~5 s</figcaption>
      <div style="width: 656px; height: 376px; box-sizing: border-box; padding: 8px; background: #000000; border-radius: 12px;">
        <div style="width: 640px; height: 360px; position: relative; overflow: hidden; background: #2A3140; color: #F2F4F7;">
          <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #8C96A8;">[ video ]</span>
          <div style="position: absolute; top: 18px; right: 18px; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: {{t.pill}}px; background: {{t.glass}}; font-size: 12px; font-weight: 500;">
            <span style="width: 8px; height: 8px; border-radius: 999px; background: {{accent}};"></span>
            <span>iPhone connected</span>
          </div>
          <div style="position: absolute; left: 18px; bottom: 22px; display: flex; gap: 14px; align-items: center; padding: 12px 18px 12px 12px; border-radius: {{t.radius}}px; background: {{t.glass}}; max-width: 420px;">
            <div style="width: 96px; height: 54px; flex-shrink: 0; border-radius: {{t.small}}px; background: #3A4254;"></div>
            <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
              <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: {{accent}};">Now playing</span>
              <span style="font-size: 15px; font-weight: 600;">[Video title]</span>
              <span style="font-size: 11px; color: #B4BCC8;">YouTube · Ad-free · 1080p</span>
            </div>
          </div>
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.15);">
            <div style="width: 4%; height: 3px; background: {{accent}};"></div>
          </div>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
      <figcaption style="font-size: 14px; color: {{t.muted}};"><strong style="color: {{t.text}}; font-weight: 600;">4 · Paused</strong> — from the TV remote or your phone</figcaption>
      <div style="width: 656px; height: 376px; box-sizing: border-box; padding: 8px; background: #000000; border-radius: 12px;">
        <div style="width: 640px; height: 360px; position: relative; overflow: hidden; background: #2A3140; color: #F2F4F7;">
          <div style="position: absolute; inset: 0; background: rgba(6,8,12,0.62);"></div>
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
            <div style="width: 68px; height: 68px; border-radius: 999px; border: 2px solid {{accent}}; display: flex; align-items: center; justify-content: center; gap: 8px;">
              <span style="width: 6px; height: 24px; border-radius: 2px; background: {{accent}};"></span>
              <span style="width: 6px; height: 24px; border-radius: 2px; background: {{accent}};"></span>
            </div>
          </div>
          <div style="position: absolute; left: 32px; right: 32px; bottom: 26px; display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 20px; font-weight: 600;">[Video title]</span>
              <span style="font-size: 12px; color: #B4BCC8;">[Channel name] · YouTube</span>
            </div>
            <div style="height: 4px; border-radius: 999px; background: rgba(255,255,255,0.2);">
              <div style="width: 38%; height: 4px; border-radius: 999px; background: {{accent}};"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 11px; color: #B4BCC8; font-family: 'JetBrains Mono', monospace;">
              <span>12:04</span>
              <span>31:47</span>
            </div>
          </div>
        </div>
      </div>
    </figure>
  </section>

  <section aria-label="iPhone remote" style="display: flex; gap: 56px; align-items: flex-start;">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
      <figcaption style="font-size: 14px; color: {{t.muted}};"><strong style="color: {{t.text}}; font-weight: 600;">5 · iPhone remote</strong> — Home Screen web app, served by the Pi (try the play button)</figcaption>
      <div style="width: 410px; height: 864px; box-sizing: border-box; padding: 10px; background: #000000; border-radius: 54px;">
        <div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 28px; border-radius: 44px; overflow: hidden; background: {{t.phone}}; color: {{t.text}}; display: flex; flex-direction: column; gap: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em;">
              <sc-if value="{{showBeam}}" hint-placeholder-val="{{true}}"><svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M7 8.6v14.8a1.2 1.2 0 0 0 1.8 1l11.8-7.4a1.2 1.2 0 0 0 0-2L8.8 7.6A1.2 1.2 0 0 0 7 8.6z" fill="{{accent}}"></path><path d="M23.5 11a7.5 7.5 0 0 1 0 10" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round"></path><path d="M27 7.5a12.5 12.5 0 0 1 0 17" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" opacity="0.55"></path></svg></sc-if>
              <sc-if value="{{showTile}}" hint-placeholder-val="{{false}}"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="{{tileRx}}" fill="{{accent}}"></rect><path d="M13 10.8v10.4a.8.8 0 0 0 1.2.7l8.3-5.2a.8.8 0 0 0 0-1.4l-8.3-5.2a.8.8 0 0 0-1.2.7z" fill="#0A0C10"></path></svg></sc-if>
              <sc-if value="{{isWordmark}}" hint-placeholder-val="{{false}}"><span>pi<span style="color: {{accent}};">·</span>cast</span></sc-if>
              <sc-if value="{{hasMark}}" hint-placeholder-val="{{true}}"><span>Pi-Cast</span></sc-if>
            </div>
            <span style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: {{t.surface}}; font-size: 12px; color: {{t.muted}};">
              <span style="width: 7px; height: 7px; border-radius: 999px; background: {{accent}};"></span>
              Living room TV
            </span>
          </div>

          <div style="display: flex; flex-direction: column; gap: 14px; padding: 14px; border-radius: {{t.radius}}px; background: {{t.surface}}; border: 1px solid {{t.line}};">
            <div style="height: 186px; border-radius: {{t.small}}px; background: #2A3140; display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #8C96A8;">[ thumbnail ]</div>
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: {{accent}};">{{nowLabel}}</span>
              <span style="font-size: 18px; font-weight: 600;">[Video title]</span>
              <span style="font-size: 13px; color: {{t.muted}};">[Channel name] · YouTube</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <div style="height: 4px; border-radius: 999px; background: {{t.dim}};">
                <div style="width: 38%; height: 4px; border-radius: 999px; background: {{accent}};"></div>
              </div>
              <div style="display: flex; justify-content: space-between; font-size: 11px; color: {{t.muted}}; font-family: 'JetBrains Mono', monospace;">
                <span>12:04</span>
                <span>31:47</span>
              </div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 12px;">
              <button type="button" aria-label="Back 10 seconds" style="width: 48px; height: 48px; border: 0; border-radius: 999px; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg></button>
              <button type="button" onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="width: 68px; height: 68px; border: 0; border-radius: 999px; background: {{accent}}; color: #0A0C10; display: flex; align-items: center; justify-content: center;">
                <sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
                <sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z"></path></svg></sc-if>
              </button>
              <button type="button" aria-label="Forward 10 seconds" style="width: 48px; height: 48px; border: 0; border-radius: 999px; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg></button>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
              <label for="vol" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Volume</label>
              <input id="vol" type="range" min="0" max="100" value="70" style="flex-grow: 1; accent-color: {{accent}};">
            </div>
          </div>

        { label: 'Style', value: '‹ ' + t.label + ' ›' },
        { label: 'Animated boot', value: onOff('glow') },
        { label: 'Skip sponsors', value: onOff('sponsor') },
        { label: 'Clock', value: s.clock24 ? '24h' : '12h' },
        { label: 'Switch TV input', value: onOff('cecSwitch') }
      ],
      font: FONTS[s.font].family,
      styleOpts: styleOpts,
      accentOpts: accentOpts,
      markOpts: opts('mark', MARKS),
      fontOpts: opts('font', FONTS),
      styleNote: t.note,
      markNote: MARKS[s.mark].note,
      fontNote: FONTS[s.font].note,
      summary: t.label + ' · ' + accentName + ' · ' + MARKS[s.mark].label + ' · ' + FONTS[s.font].label,
      showBeam: s.mark === 'beam',
      showTile: s.mark === 'tile',
      isWordmark: s.mark === 'wordmark',
      hasMark: s.mark !== 'wordmark',
      tileRx: t.tileRx,
      bootWordSize: s.mark === 'wordmark' ? 44 : 30,
      playing: s.playing,
      paused: !s.playing,
      playLabel: s.playing ? 'Pause' : 'Play',
      nowLabel: s.playing ? 'Playing on TV' : 'Paused',
      togglePlay: function () { self.setState({ playing: !s.playing }); },
      recent: [
        { title: '[Recent video 1]', source: 'YouTube' },
        { title: '[Streamer name]', source: 'Twitch' },
        { title: '[Recent video 2]', source: 'YouTube' }
      ]
    };
  }
}
</script>
</body>
</html>
